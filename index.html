<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Picks LFA — Semanal</title>

<style>
/* (TU CSS ORIGINAL, NO CAMBIÉ NADA) */
:root {
  --bg: #1c1c1c;
  --panel: #2b2b2b;
  --muted: #aeb7bf;
  --accent1: #006847;
  --accent2: #ce1126;
}
body { margin:0; font-family: Arial; background: var(--bg); color:#fff; }
/* ... todo tu CSS igual ... */
</style>
</head>

<body>

<header>
  <div class="left">
    <img class="nfl" src="https://i0.wp.com/lfa.mx/2018/wp-content/uploads/2026/03/LFA_Logo-scaled.png?fit=800%2C881&ssl=1" />
    <strong>Picks Semanal</strong>
  </div>
  <div class="right">
    <select id="semana"></select>
    <span id="aciertos">Aciertos: 0</span>
    <button onclick="reiniciar()">Reiniciar</button>
    <button id="bloquearBtn" onclick="toggleBloqueo()">Bloquear</button>
    <button id="descargarImg">Descargar</button>
  </div>
</header>

<main id="contenedor"></main>

<script>
/* --------------------
   CONFIG CLAVE 🔥
-------------------- */
const STORAGE_PREFIX = "LFA_";

let bloqueo = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "bloqueo")) || false;

/* --------------------
   Equipos y logos
-------------------- */
const equipos = [
  "Mexicas","Caudillos","Dinos","Fundidores",
  "Raptors","Gallos Negros","Reyes","Jefes","Osos"
];

const logos = {
  "Mexicas":"https://i0.wp.com/mexicaslfa.com/wp-content/uploads/2020/12/MEXICASlogo.png?w=300&ssl=1",
  "Caudillos":"https://upload.wikimedia.org/wikipedia/en/2/22/Caudillos_de_Chihuahua_logo.png",
  "Dinos":"https://upload.wikimedia.org/wikipedia/en/3/3d/Dinos_Saltillo_logo.png",
  "Fundidores":"https://upload.wikimedia.org/wikipedia/en/1/19/Fundidores_Monterrey_logo.png",
  "Raptors":"https://upload.wikimedia.org/wikipedia/en/f/f3/Raptors_Naucalpan_logo.png",
  "Gallos Negros":"https://gallosnegroslfa.com/wp-content/uploads/2026/02/logo-gallo@2x-600x362.png",
  "Reyes":"https://upload.wikimedia.org/wikipedia/en/a/a3/Reyes_de_Jalisco_logo.png",
  "Jefes":"https://upload.wikimedia.org/wikipedia/en/4/4c/Jefes_de_Ciudad_Ju%C3%A1rez_logo.png",
  "Osos":"https://ososlfa.com/cdn/shop/files/Asset_2osos.png?v=1736539686&width=5760",
};

const contenedor = document.getElementById("contenedor");
const semanaSelect = document.getElementById("semana");
const aciertosDisplay = document.getElementById("aciertos");

/* --------------------
   Semanas
-------------------- */
for(let s=1; s<=8; s++){
  const o=document.createElement("option");
  o.value=s;
  o.textContent="Semana "+s;
  semanaSelect.appendChild(o);
}

semanaSelect.value = localStorage.getItem(STORAGE_PREFIX+"semanaActual") || 1;

/* --------------------
   Crear juegos
-------------------- */
function crearJuegos(){
  contenedor.innerHTML="";
  const semana = semanaSelect.value;
  const guardado = JSON.parse(localStorage.getItem(STORAGE_PREFIX+"semana"+semana)) || [];

  for(let i=1; i<=6; i++){
    const juego = document.createElement("div");
    juego.className="juego";

    juego.innerHTML = `
    <div style="font-weight:700">Juego ${i}</div>

    <div class="equipos">
      <div class="equipo visitante">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>

      <div style="font-weight:700; color:var(--muted)">VS</div>

      <div class="equipo local">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>
    </div>

    <div class="botones">
      <button class="btnVisitante">Visitante</button>
      <button class="btnEmpate">Empate</button>
      <button class="btnLocal">Local</button>
    </div>

    <div class="ganador">
      <select class="ganador-select">
        <option value="">Ganador real</option>
      </select>
    </div>
    `;

    contenedor.appendChild(juego);

    const visNombre=juego.querySelector(".visitante .nombre-equipo");
    const locNombre=juego.querySelector(".local .nombre-equipo");

    const menuVis=juego.querySelector(".visitante .menu-equipos");
    const menuLoc=juego.querySelector(".local .menu-equipos");

    const btnVis=juego.querySelector(".btnVisitante");
    const btnEmp=juego.querySelector(".btnEmpate");
    const btnLoc=juego.querySelector(".btnLocal");
    const selGan=juego.querySelector(".ganador-select");

    let equipoLocal = "";
    let equipoVisitante = "";

    /* Menús */
    equipos.forEach(eq=>{
      const item=document.createElement("div");
      item.className="item-equipo";
      item.dataset.team=eq;
      item.textContent=eq;

      const item2=item.cloneNode(true);

      menuVis.appendChild(item);
      menuLoc.appendChild(item2);

      const opt=document.createElement("option");
      opt.value=eq;
      opt.textContent=eq;
      selGan.appendChild(opt);
    });

    /* Cargar guardado */
    const datos = guardado[i-1] || {};

    equipoLocal = datos.local || "";
    equipoVisitante = datos.visitante || "";

    if(equipoVisitante){
      visNombre.innerHTML = `<img class="logo" src="${logos[equipoVisitante]}">`;
    }
    if(equipoLocal){
      locNombre.innerHTML = `<img class="logo" src="${logos[equipoLocal]}">`;
    }

    selGan.value = datos.ganador || "";

    if(datos.pick){
      if(datos.pick==="Local") btnLoc.classList.add("activo");
      if(datos.pick==="Visitante") btnVis.classList.add("activo");
      if(datos.pick==="Empate") btnEmp.classList.add("activo");
    }

    /* Guardar */
    function guardar(){
      const data = JSON.parse(localStorage.getItem(STORAGE_PREFIX+"semana"+semana)) || [];
      data[i-1] = {
        local: equipoLocal,
        visitante: equipoVisitante,
        ganador: selGan.value || "",
        pick: data[i-1]?.pick || null
      };
      localStorage.setItem(STORAGE_PREFIX+"semana"+semana, JSON.stringify(data));
      calcularAciertos();
    }

    function guardarPick(p){
      const data = JSON.parse(localStorage.getItem(STORAGE_PREFIX+"semana"+semana)) || [];
      data[i-1] = {
        local: equipoLocal,
        visitante: equipoVisitante,
        ganador: selGan.value || "",
        pick: p
      };
      localStorage.setItem(STORAGE_PREFIX+"semana"+semana, JSON.stringify(data));
      calcularAciertos();
    }

    /* Eventos selección */
    menuVis.querySelectorAll(".item-equipo").forEach(item=>{
      item.onclick=()=>{
        if(bloqueo) return;
        equipoVisitante=item.dataset.team;
        visNombre.innerHTML=`<img class="logo" src="${logos[equipoVisitante]}">`;
        guardar();
      };
    });

    menuLoc.querySelectorAll(".item-equipo").forEach(item=>{
      item.onclick=()=>{
        if(bloqueo) return;
        equipoLocal=item.dataset.team;
        locNombre.innerHTML=`<img class="logo" src="${logos[equipoLocal]}">`;
        guardar();
      };
    });

    btnLoc.onclick=()=>{ if(!bloqueo){ btnLoc.classList.add("activo"); btnVis.classList.remove("activo"); btnEmp.classList.remove("activo"); guardarPick("Local"); }};
    btnVis.onclick=()=>{ if(!bloqueo){ btnVis.classList.add("activo"); btnLoc.classList.remove("activo"); btnEmp.classList.remove("activo"); guardarPick("Visitante"); }};
    btnEmp.onclick=()=>{ if(!bloqueo){ btnEmp.classList.add("activo"); btnLoc.classList.remove("activo"); btnVis.classList.remove("activo"); guardarPick("Empate"); }};

    selGan.onchange=guardar;
  }

  calcularAciertos();
}

/* --------------------
   Aciertos
-------------------- */
function calcularAciertos(){
  const semana=semanaSelect.value;
  const d=JSON.parse(localStorage.getItem(STORAGE_PREFIX+"semana"+semana))||[];
  let ac=0;

  d.forEach(j=>{
    if(!j) return;
    if(j.pick && j.ganador){
      if(j.pick==="Local" && j.local===j.ganador) ac++;
      if(j.pick==="Visitante" && j.visitante===j.ganador) ac++;
    }
  });

  aciertosDisplay.textContent="Aciertos: "+ac;
}

/* --------------------
   Eventos
-------------------- */
semanaSelect.onchange=()=>{
  localStorage.setItem(STORAGE_PREFIX+"semanaActual", semanaSelect.value);
  crearJuegos();
};

crearJuegos();
      </script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
