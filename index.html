<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Picks LFA — Semanal</title>

<style>
/* (TU CSS ORIGINAL, NO CAMBIÉ NADA) */
:root {
  --bg: #1c1c1c;
  --panel: #2b2b2b;
  --muted: #aeb7bf;
  --accent1: #006847;
  --accent2: #ce1126;
}
body { margin:0; font-family: Arial; background: var(--bg); color:#fff; }
/* ... todo tu CSS igual ... */
</style>
</head>

<body>

<header>
  <div class="left">
    <img class="nfl" src="https://i0.wp.com/lfa.mx/2018/wp-content/uploads/2026/03/LFA_Logo-scaled.png?fit=800%2C881&ssl=1" />
    <strong>Picks Semanal</strong>
  </div>
  <div class="right">
    <select id="semana"></select>
    <span id="aciertos">Aciertos: 0</span>
    <button onclick="reiniciar()">Reiniciar</button>
    <button id="bloquearBtn" onclick="toggleBloqueo()">Bloquear</button>
    <button id="descargarImg">Descargar</button>
  </div>
</header>

<main id="contenedor"></main>

<script>
/* 🔥 PREFIJO LFA */
const KEY = "lfa_";

let bloqueo = JSON.parse(localStorage.getItem(KEY+"bloqueo")) || false;

const equipos = ["Mexicas","Caudillos","Dinos","Fundidores","Raptors","Gallos Negros","Reyes","Jefes","Osos"];

const logos = {
  "Mexicas":"https://i0.wp.com/mexicaslfa.com/wp-content/uploads/2020/12/MEXICASlogo.png?w=300&ssl=1",
  "Caudillos":"https://upload.wikimedia.org/wikipedia/en/2/22/Caudillos_de_Chihuahua_logo.png",
  "Dinos":"https://upload.wikimedia.org/wikipedia/en/3/3d/Dinos_Saltillo_logo.png",
  "Fundidores":"https://upload.wikimedia.org/wikipedia/en/1/19/Fundidores_Monterrey_logo.png",
  "Raptors":"https://upload.wikimedia.org/wikipedia/en/f/f3/Raptors_Naucalpan_logo.png",
  "Gallos Negros":"https://gallosnegroslfa.com/wp-content/uploads/2026/02/logo-gallo@2x-600x362.png",
  "Reyes":"https://upload.wikimedia.org/wikipedia/en/a/a3/Reyes_de_Jalisco_logo.png",
  "Jefes":"https://upload.wikimedia.org/wikipedia/en/4/4c/Jefes_de_Ciudad_Ju%C3%A1rez_logo.png",
  "Osos":"https://ososlfa.com/cdn/shop/files/Asset_2osos.png?v=1736539686&width=5760"
};

const contenedor = document.getElementById("contenedor");
const semanaSelect = document.getElementById("semana");
const aciertosDisplay = document.getElementById("aciertos");

/* semanas */
for(let s=1;s<=8;s++){
  let o=document.createElement("option");
  o.value=s;
  o.textContent="Semana "+s;
  semanaSelect.appendChild(o);
}

semanaSelect.value = localStorage.getItem(KEY+"semanaActual") || 1;

function crearJuegos(){
  contenedor.innerHTML="";
  const semana = semanaSelect.value;
  const guardado = JSON.parse(localStorage.getItem(KEY+"semana"+semana)) || [];

  for(let i=1;i<=6;i++){
    const juego=document.createElement("div");
    juego.className="juego";

    juego.innerHTML = `
    <div><b>Juego ${i}</b></div>
    <div class="equipos">
      <div class="equipo visitante">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>
      <div>VS</div>
      <div class="equipo local">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>
    </div>
    <div class="botones">
      <button class="btnVisitante">Visitante</button>
      <button class="btnEmpate">Empate</button>
      <button class="btnLocal">Local</button>
    </div>
    <select class="ganador-select">
      <option value="">Ganador real</option>
    </select>
    `;

    contenedor.appendChild(juego);

    const visNombre=juego.querySelector(".visitante .nombre-equipo");
    const locNombre=juego.querySelector(".local .nombre-equipo");

    let equipoLocal="";
    let equipoVisitante="";

    const datos = guardado[i-1] || {};

    if(datos.visitante){
      equipoVisitante = datos.visitante;
      visNombre.innerHTML = `<img class="logo" src="${logos[equipoVisitante]}">`;
    }

    if(datos.local){
      equipoLocal = datos.local;
      locNombre.innerHTML = `<img class="logo" src="${logos[equipoLocal]}">`;
    }

    const selGan=juego.querySelector(".ganador-select");
    const btnVis=juego.querySelector(".btnVisitante");
    const btnEmp=juego.querySelector(".btnEmpate");
    const btnLoc=juego.querySelector(".btnLocal");

    equipos.forEach(eq=>{
      let opt=document.createElement("option");
      opt.value=eq;
      opt.textContent=eq;
      selGan.appendChild(opt);
    });

    selGan.value = datos.ganador || "";

    function guardar(pick=null){
      const data = JSON.parse(localStorage.getItem(KEY+"semana"+semana)) || [];

      data[i-1] = {
        local: equipoLocal,
        visitante: equipoVisitante,
        ganador: selGan.value || "",
        pick: pick ?? data[i-1]?.pick ?? null
      };

      localStorage.setItem(KEY+"semana"+semana, JSON.stringify(data));
      calcularAciertos();
    }

    /* seleccionar equipos */
    juego.querySelectorAll(".visitante .selector-equipo")[0].onclick=()=>{
      let t=prompt("Equipo visitante:",equipoVisitante);
      if(t && logos[t]){
        equipoVisitante=t;
        visNombre.innerHTML=`<img class="logo" src="${logos[t]}">`;
        guardar();
      }
    };

    juego.querySelectorAll(".local .selector-equipo")[0].onclick=()=>{
      let t=prompt("Equipo local:",equipoLocal);
      if(t && logos[t]){
        equipoLocal=t;
        locNombre.innerHTML=`<img class="logo" src="${logos[t]}">`;
        guardar();
      }
    };

    btnLoc.onclick=()=>guardar("Local");
    btnVis.onclick=()=>guardar("Visitante");
    btnEmp.onclick=()=>guardar("Empate");
    selGan.onchange=()=>guardar();
  }

  calcularAciertos();
}

function calcularAciertos(){
  const semana=semanaSelect.value;
  const d=JSON.parse(localStorage.getItem(KEY+"semana"+semana))||[];
  let ac=0;
  d.forEach(j=>{
    if(j?.pick && j?.ganador){
      if(j.pick==="Local" && j.local===j.ganador) ac++;
      if(j.pick==="Visitante" && j.visitante===j.ganador) ac++;
    }
  });
  aciertosDisplay.textContent="Aciertos: "+ac;
}

function toggleBloqueo(){
  bloqueo=!bloqueo;
  localStorage.setItem(KEY+"bloqueo", JSON.stringify(bloqueo));
}

function reiniciar(){
  localStorage.removeItem(KEY+"semana"+semanaSelect.value);
  localStorage.removeItem(KEY+"bloqueo");
  crearJuegos();
}

semanaSelect.onchange=()=>{
  localStorage.setItem(KEY+"semanaActual", semanaSelect.value);
  crearJuegos();
};

document.getElementById("descargarImg").onclick = async ()=>{
  const canvas=await html2canvas(document.querySelector("main"));
  const link=document.createElement("a");
  link.download=`picks_lfa_semana_${semanaSelect.value}.png`;
  link.href=canvas.toDataURL();
  link.click();
};

crearJuegos();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
