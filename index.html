<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Picks LFA — Semanal</title>

<style>
:root {
  --bg: #1c1c1c;
  --panel: #2b2b2b;
  --muted: #aeb7bf;
  --accent1: #006847;
  --accent2: #ce1126;
}

body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: #fff;
}

header {
  background: linear-gradient(to right, var(--accent1), var(--accent2));
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  position:sticky;
  top:0;
  z-index:50;
}

header .right {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

header button, header select {
  padding:6px 10px;
  border-radius:6px;
  border:none;
}

.aciertos {
  background: rgba(255,255,255,0.18);
  padding:6px 10px;
  border-radius:8px;
}

main {
  max-width:900px;
  margin:18px auto;
}

.juego {
  background: var(--panel);
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
}

.equipos {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.equipo {
  width:42%;
  text-align:center;
  position:relative;
}

.selector-equipo {
  padding:6px;
  border-radius:6px;
}

.nombre-equipo img {
  width:64px;
}

.menu-equipos {
  display:none;
  position:absolute;
  background:#222;
  max-height:200px;
  overflow:auto;
}

.menu-equipos.activo {
  display:block;
}

.botones {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}

.botones button.activo {
  background:#0055a4;
}

.locked {
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  <div>Picks LFA</div>
  <div class="right">
    <select id="semana"></select>
    <span id="aciertos">Aciertos: 0</span>
    <button onclick="reiniciar()">Reiniciar</button>
    <button onclick="toggleBloqueo()">Bloquear</button>
    <button id="descargarImg">Descargar</button>
  </div>
</header>

<main id="contenedor"></main>

<script>
let bloqueo = JSON.parse(localStorage.getItem("bloqueo")) || false;

const equipos = ["Mexicas","Caudillos","Dinos","Fundidores","Raptors","Gallos Negros","Reyes","Jefes","Osos"];

const logos = {
  "Mexicas":"mexicas.png",
  "Caudillos":"caudillos.png",
  "Dinos":"dinos.png",
  "Fundidores":"fundidores.png",
  "Raptors":"raptors.png",
  "Gallos Negros":"gallos.png",
  "Reyes":"reyes.png",
  "Jefes":"jefes.png",
  "Osos":"osos.png"
};

const contenedor = document.getElementById("contenedor");
const semanaSelect = document.getElementById("semana");
const aciertosDisplay = document.getElementById("aciertos");

/* semanas */
for(let s=1; s<=8; s++){
  let o=document.createElement("option");
  o.value=s;
  o.textContent="Semana "+s;
  semanaSelect.appendChild(o);
}

semanaSelect.value = localStorage.getItem("semanaActual") || 1;

/* crear juegos */
function crearJuegos(){
  contenedor.innerHTML="";
  const semana = semanaSelect.value;
  const guardado = JSON.parse(localStorage.getItem("semana"+semana)) || [];

  for(let i=1;i<=6;i++){
    const juego=document.createElement("div");
    juego.className="juego";

    juego.innerHTML=`
    <div>Juego ${i}</div>
    <div class="equipos">
      <div class="equipo visitante">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>
      <div>VS</div>
      <div class="equipo local">
        <button class="selector-equipo">Elegir</button>
        <div class="nombre-equipo"></div>
        <div class="menu-equipos"></div>
      </div>
    </div>
    <div class="botones">
      <button class="btnVisitante">Visitante</button>
      <button class="btnEmpate">Empate</button>
      <button class="btnLocal">Local</button>
    </div>
    <select class="ganador-select">
      <option value="">Ganador real</option>
    </select>
    `;

    contenedor.appendChild(juego);

    const visNombre=juego.querySelector(".visitante .nombre-equipo");
    const locNombre=juego.querySelector(".local .nombre-equipo");

    const datos=guardado[i-1]||{};
    let equipoLocal=datos.local||"";
    let equipoVisitante=datos.visitante||"";

    /* 🔥 ARREGLADO */
    if(equipoVisitante){
      visNombre.innerHTML = `<img src="${logos[equipoVisitante]}">`;
    }

    if(equipoLocal){
      locNombre.innerHTML = `<img src="${logos[equipoLocal]}">`;
    }
  }

  calcularAciertos();
}

/* aciertos */
function calcularAciertos(){
  const semana=semanaSelect.value;
  const d=JSON.parse(localStorage.getItem("semana"+semana))||[];
  let ac=0;
  d.forEach(j=>{
    if(j?.pick && j?.ganador){
      if(j.pick==="Local" && j.local===j.ganador) ac++;
      if(j.pick==="Visitante" && j.visitante===j.ganador) ac++;
    }
  });
  aciertosDisplay.textContent="Aciertos: "+ac;
}

/* reset */
function reiniciar(){
  localStorage.removeItem("semana"+semanaSelect.value);
  crearJuegos();
}

/* bloqueo */
function toggleBloqueo(){
  bloqueo=!bloqueo;
  localStorage.setItem("bloqueo",JSON.stringify(bloqueo));
}

/* descargar */
document.getElementById("descargarImg").onclick=async()=>{
  const canvas=await html2canvas(document.querySelector("main"));
  const link=document.createElement("a");

  /* 🔥 ARREGLADO */
  link.download = `picks_semana_${semanaSelect.value}.png`;

  link.href=canvas.toDataURL();
  link.click();
};

semanaSelect.onchange=()=>{
  localStorage.setItem("semanaActual",semanaSelect.value);
  crearJuegos();
};

/* iniciar */
crearJuegos();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
