<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Picks LFA — Semanal</title>

<style>
/* (TODO tu CSS se queda EXACTAMENTE igual, no lo toqué) */
:root {
  --bg: #1c1c1c;
  --panel: #2b2b2b;
  --muted: #aeb7bf;
  --accent1: #006847;
  --accent2: #ce1126;
}
body { margin:0; font-family: Arial; background: var(--bg); color:#fff; }
header { background: linear-gradient(to right, var(--accent1), var(--accent2)); display:flex; justify-content:space-between; padding:10px; }
main { max-width:900px; margin:18px auto; }
.juego { background: var(--panel); padding:12px; margin-bottom:12px; border-radius:10px; }
.equipos { display:flex; justify-content:space-between; }
.equipo { width:42%; text-align:center; }
.nombre-equipo img { width:64px; }
.botones button.activo { background:#0055a4; }
.locked { opacity:0.6; pointer-events:none; }
.locked .ganador { pointer-events:auto; opacity:1; }
</style>
</head>

<body>

<header>
  <div>Picks LFA</div>
  <div>
    <select id="semana"></select>
    <span id="aciertos">Aciertos: 0</span>
    <button onclick="reiniciar()">Reiniciar</button>
    <button id="bloquearBtn" onclick="toggleBloqueo()">Bloquear</button>
  </div>
</header>

<main id="contenedor"></main>

<script>

/* 🔥 PREFIJOS LFA (CLAVE DEL FIX) */
const LS_BLOQUEO = "bloqueoLFA";
const LS_SEMANA = "semanaActualLFA";
const LS_DATA = "semanaLFA_";

/* -------------------- */
let bloqueo = JSON.parse(localStorage.getItem(LS_BLOQUEO)) || false;

const equipos = ["Mexicas","Caudillos","Dinos","Fundidores","Raptors","Gallos Negros","Reyes","Jefes","Osos"];

const logos = {
  "Mexicas":"mexicas.png",
  "Caudillos":"caudillos.png",
  "Dinos":"dinos.png",
  "Fundidores":"fundidores.png",
  "Raptors":"raptors.png",
  "Gallos Negros":"gallos.png",
  "Reyes":"reyes.png",
  "Jefes":"jefes.png",
  "Osos":"osos.png"
};

const contenedor = document.getElementById("contenedor");
const semanaSelect = document.getElementById("semana");
const aciertosDisplay = document.getElementById("aciertos");

/* Semanas */
for(let s=1; s<=8; s++){
  let o=document.createElement("option");
  o.value=s;
  o.textContent="Semana "+s;
  semanaSelect.appendChild(o);
}

semanaSelect.value = localStorage.getItem(LS_SEMANA) || 1;

/* Crear juegos */
function crearJuegos(){
  contenedor.innerHTML="";
  const semana = semanaSelect.value;
  const guardado = JSON.parse(localStorage.getItem(LS_DATA+semana)) || [];

  for(let i=1;i<=6;i++){

    const juego=document.createElement("div");
    juego.className="juego";

    juego.innerHTML=`
      <div>Juego ${i}</div>

      <div class="equipos">
        <div class="equipo visitante">
          <button class="selVis">Elegir</button>
          <div class="nombreVis"></div>
        </div>

        <div>VS</div>

        <div class="equipo local">
          <button class="selLoc">Elegir</button>
          <div class="nombreLoc"></div>
        </div>
      </div>

      <div class="botones">
        <button class="v">Visitante</button>
        <button class="e">Empate</button>
        <button class="l">Local</button>
      </div>

      <div class="ganador">
        <select class="ganador-select">
          <option value="">Ganador real</option>
          ${equipos.map(e=>`<option>${e}</option>`).join("")}
        </select>
      </div>
    `;

    contenedor.appendChild(juego);

    let datos = guardado[i-1] || {};

    let equipoLocal = datos.local || "";
    let equipoVisitante = datos.visitante || "";

    const vis=juego.querySelector(".nombreVis");
    const loc=juego.querySelector(".nombreLoc");

    if(equipoVisitante){
      vis.innerHTML=`<img src="${logos[equipoVisitante]}">`;
    }
    if(equipoLocal){
      loc.innerHTML=`<img src="${logos[equipoLocal]}">`;
    }

    const selGan=juego.querySelector(".ganador-select");
    selGan.value = datos.ganador || "";

    const btnV=juego.querySelector(".v");
    const btnE=juego.querySelector(".e");
    const btnL=juego.querySelector(".l");

    if(datos.pick==="Local") btnL.classList.add("activo");
    if(datos.pick==="Visitante") btnV.classList.add("activo");
    if(datos.pick==="Empate") btnE.classList.add("activo");

    function guardar(pick=null){
      const data = JSON.parse(localStorage.getItem(LS_DATA+semana)) || [];

      data[i-1]={
        local: equipoLocal,
        visitante: equipoVisitante,
        ganador: selGan.value,
        pick: pick ?? data[i-1]?.pick ?? null
      };

      localStorage.setItem(LS_DATA+semana, JSON.stringify(data));
      calcularAciertos();
    }

    /* Eventos selección */
    juego.querySelector(".selVis").onclick=()=>{
      if(bloqueo) return;
      let t = prompt("Equipo visitante:");
      if(logos[t]){
        equipoVisitante=t;
        vis.innerHTML=`<img src="${logos[t]}">`;
        guardar();
      }
    };

    juego.querySelector(".selLoc").onclick=()=>{
      if(bloqueo) return;
      let t = prompt("Equipo local:");
      if(logos[t]){
        equipoLocal=t;
        loc.innerHTML=`<img src="${logos[t]}">`;
        guardar();
      }
    };

    btnL.onclick=()=>{ if(!bloqueo){ btnL.classList.add("activo"); btnV.classList.remove("activo"); btnE.classList.remove("activo"); guardar("Local"); }};
    btnV.onclick=()=>{ if(!bloqueo){ btnV.classList.add("activo"); btnL.classList.remove("activo"); btnE.classList.remove("activo"); guardar("Visitante"); }};
    btnE.onclick=()=>{ if(!bloqueo){ btnE.classList.add("activo"); btnL.classList.remove("activo"); btnV.classList.remove("activo"); guardar("Empate"); }};

    selGan.onchange=()=>guardar();
  }

  aplicarBloqueo();
  calcularAciertos();
}

/* Aciertos */
function calcularAciertos(){
  const semana=semanaSelect.value;
  const d=JSON.parse(localStorage.getItem(LS_DATA+semana))||[];
  let ac=0;

  d.forEach(j=>{
    if(!j) return;
    if(j.pick && j.ganador){
      if(j.pick==="Local" && j.local===j.ganador) ac++;
      if(j.pick==="Visitante" && j.visitante===j.ganador) ac++;
    }
  });

  aciertosDisplay.textContent="Aciertos: "+ac;
}

/* Bloqueo */
function aplicarBloqueo(){
  document.querySelectorAll(".juego").forEach(j=>{
    if(bloqueo){
      j.classList.add("locked");
    }else{
      j.classList.remove("locked");
    }
  });

  document.getElementById("bloquearBtn").textContent = bloqueo ? "Bloqueado" : "Bloquear";
}

/* Toggle */
function toggleBloqueo(){
  bloqueo = !bloqueo;
  localStorage.setItem(LS_BLOQUEO, JSON.stringify(bloqueo));
  aplicarBloqueo();
}

/* Reiniciar */
function reiniciar(){
  if(!confirm("¿Reiniciar semana?")) return;

  localStorage.removeItem(LS_DATA+semanaSelect.value);
  localStorage.removeItem(LS_BLOQUEO);

  bloqueo=false;
  crearJuegos();
}

/* Cambio semana */
semanaSelect.onchange=()=>{
  localStorage.setItem(LS_SEMANA, semanaSelect.value);
  crearJuegos();
};

/* Init */
crearJuegos();
aplicarBloqueo();

</script>

</body>
</html>
